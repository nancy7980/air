<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style C — Depth</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #06090F;
  --gold: #D4AA6A;
  --gold-soft: rgba(212,170,106,0.12);
  --teal: #4DC4A8;
  --text: #E8E3DB;
  --text-dim: rgba(232,227,219,0.38);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

body {
  background: var(--bg);
  height: 100vh;
  overflow: hidden;
  font-family: 'Noto Sans SC', sans-serif;
  position: relative;
}

/* Canvas particle field */
canvas {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 1;
}

/* Deep radial background */
.bg-radial {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 70% 40%, rgba(212,170,106,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 10% 80%, rgba(77,196,168,0.05) 0%, transparent 60%);
}

/* Left vertical line with tick marks */
.vline {
  position: fixed;
  left: clamp(2rem, 5vw, 5rem);
  top: 15vh; bottom: 15vh;
  width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(212,170,106,0.25) 20%, rgba(212,170,106,0.25) 80%, transparent);
  z-index: 5;
  transform: scaleY(0);
  transform-origin: top;
  animation: vgrow 1s 0.5s var(--ease) forwards;
}
.vline::before, .vline::after {
  content: '';
  position: absolute;
  left: -3px;
  width: 7px; height: 1px;
  background: var(--gold);
}
.vline::before { top: 0; }
.vline::after { bottom: 0; }
@keyframes vgrow { to { transform: scaleY(1); } }

/* Coordinates label */
.coords {
  position: fixed;
  left: clamp(2rem, 5vw, 5rem);
  top: calc(15vh - 1.8rem);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  color: rgba(212,170,106,0.5);
  opacity: 0;
  animation: fadeIn 0.5s 1.5s forwards;
}

/* Main content */
.slide {
  position: relative;
  z-index: 10;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: clamp(5rem, 12vw, 12rem);
  padding-right: clamp(3rem, 8vw, 9rem);
}

/* Eyebrow */
.eyebrow {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  margin-bottom: clamp(2rem, 4vh, 4rem);
  opacity: 0;
  animation: fadeBlur 0.8s 0.6s var(--ease) forwards;
}
.eyebrow-line {
  width: 40px; height: 1px;
  background: var(--teal);
}
.eyebrow-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.58rem, 0.85vw, 0.7rem);
  letter-spacing: 0.2em;
  color: var(--teal);
  text-transform: uppercase;
}

/* Title — large Fraunces */
.title {
  font-family: 'Fraunces', 'Noto Serif SC', serif;
  font-size: clamp(2.4rem, 6.5vw, 6rem);
  font-weight: 700;
  line-height: 1.08;
  color: var(--text);
  letter-spacing: -0.02em;
}

.title-line {
  display: block;
  overflow: hidden;
}
.title-inner {
  display: block;
  transform: translateY(100%);
  opacity: 0;
}
.title-line:nth-child(1) .title-inner { animation: slideUp 0.9s 0.8s var(--ease) forwards; }
.title-line:nth-child(2) .title-inner { animation: slideUp 0.9s 1.0s var(--ease) forwards; }

.title-line:nth-child(2) .title-inner {
  font-style: italic;
  color: var(--gold);
  font-size: 0.72em;
  font-weight: 400;
}

@keyframes slideUp {
  to { transform: translateY(0); opacity: 1; }
}

/* Module tags — horizontal list */
.modules {
  margin-top: clamp(2.5rem, 4vh, 4.5rem);
  display: flex;
  gap: clamp(1.5rem, 2.5vw, 3rem);
  opacity: 0;
  animation: fadeBlur 0.7s 1.5s var(--ease) forwards;
}
.module {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.module-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem;
  color: rgba(212,170,106,0.5);
  letter-spacing: 0.15em;
}
.module-name {
  font-size: clamp(0.7rem, 1.1vw, 0.85rem);
  color: var(--text-dim);
  letter-spacing: 0.04em;
}

/* Separator between modules */
.module-sep {
  width: 1px;
  background: rgba(212,170,106,0.15);
  align-self: stretch;
  margin: 0;
}

/* Bottom */
.bottom {
  position: absolute;
  bottom: clamp(2.5rem, 4vh, 4rem);
  left: clamp(5rem, 12vw, 12rem);
  right: clamp(3rem, 8vw, 9rem);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  opacity: 0;
  animation: fadeIn 0.7s 1.8s forwards;
}
.bottom-name {
  font-family: 'Fraunces', serif;
  font-size: clamp(0.9rem, 1.5vw, 1.15rem);
  font-weight: 700;
  color: var(--text);
}
.bottom-right {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.55rem, 0.85vw, 0.68rem);
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-align: right;
  line-height: 2;
}

/* Breathing dot */
.dot {
  position: fixed;
  bottom: clamp(2.5rem, 4.5vh, 4.5rem);
  right: clamp(3rem, 8vw, 9rem);
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0;
  animation: dotPulse 2.5s 2s ease-in-out infinite, fadeIn 0.3s 2s forwards;
}
@keyframes dotPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(212,170,106,0.5); }
  50% { box-shadow: 0 0 0 6px transparent; }
}

.style-badge {
  position: fixed;
  top: 1.5rem; right: 1.5rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  color: var(--gold);
  border: 1px solid rgba(212,170,106,0.25);
  padding: 0.4em 0.8em;
  z-index: 20;
}

@keyframes fadeIn { to { opacity: 1; } }
@keyframes fadeBlur { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: blur(0); } }
</style>
</head>
<body>
<div class="bg-radial"></div>
<div class="vline"></div>
<div class="coords">25.5° N / 119.3° E</div>
<div class="style-badge">STYLE C · DEPTH</div>

<div class="slide">
  <div class="eyebrow">
    <div class="eyebrow-line"></div>
    <div class="eyebrow-text">千问 AI 产品经理 · 候选人自荐</div>
  </div>

  <h1 class="title">
    <span class="title-line"><span class="title-inner">千问语音助手</span></span>
    <span class="title-line"><span class="title-inner">产品思考</span></span>
  </h1>

  <div class="modules">
    <div class="module">
      <span class="module-num">01</span>
      <span class="module-name">市场判断</span>
    </div>
    <div class="module-sep"></div>
    <div class="module">
      <span class="module-num">02</span>
      <span class="module-name">体验报告</span>
    </div>
    <div class="module-sep"></div>
    <div class="module">
      <span class="module-num">03</span>
      <span class="module-name">生态机会</span>
    </div>
    <div class="module-sep"></div>
    <div class="module">
      <span class="module-num">04</span>
      <span class="module-name">候选人自荐</span>
    </div>
  </div>

  <div class="bottom">
    <div class="bottom-name">候选人姓名</div>
    <div class="bottom-right">
      应聘 千问 AI 产品经理<br>2026年5月
    </div>
  </div>
</div>

<div class="dot"></div>
</body>
</html>
