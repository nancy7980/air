<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style A — Celestial</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0A0E1A;
  --gold: #D4A574;
  --gold-dim: rgba(212, 165, 116, 0.15);
  --gold-glow: rgba(212, 165, 116, 0.06);
  --text: #EAE6E0;
  --text-dim: rgba(234, 230, 224, 0.45);
}

body {
  background: var(--bg);
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Sans SC', sans-serif;
}

/* Ambient orbs */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
}
.orb-1 {
  width: 45vw; height: 45vw;
  background: radial-gradient(circle, rgba(212,165,116,0.12) 0%, transparent 70%);
  top: -15vw; right: -10vw;
  animation: drift1 18s ease-in-out infinite;
}
.orb-2 {
  width: 30vw; height: 30vw;
  background: radial-gradient(circle, rgba(91,206,174,0.07) 0%, transparent 70%);
  bottom: -5vw; left: 5vw;
  animation: drift2 24s ease-in-out infinite;
}
.orb-3 {
  width: 20vw; height: 20vw;
  background: radial-gradient(circle, rgba(212,165,116,0.08) 0%, transparent 70%);
  top: 50%; left: 20%;
  animation: drift3 30s ease-in-out infinite;
}
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-3vw, 4vw) scale(1.08); } }
@keyframes drift2 { 0%,100% { transform: translate(0,0); } 33% { transform: translate(3vw, -3vw); } 66% { transform: translate(-2vw, 2vw); } }
@keyframes drift3 { 0%,100% { transform: translate(0,-50%) scale(1); } 50% { transform: translate(2vw,-48%) scale(1.05); } }

/* Thin grid background */
.grid-bg {
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(212,165,116,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,165,116,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* Content */
.slide {
  position: relative;
  z-index: 10;
  width: 100vw; height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(3rem, 8vw, 8rem) clamp(3rem, 8vw, 9rem);
}

/* Top label */
.label {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.6rem, 1vw, 0.75rem);
  letter-spacing: 0.2em;
  color: var(--gold);
  text-transform: uppercase;
  opacity: 0;
  animation: fadeUp 0.8s 0.2s var(--ease) forwards;
  margin-bottom: clamp(1.5rem, 3vh, 3rem);
}

/* Gold line */
.line {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
  margin-bottom: clamp(2rem, 4vh, 4rem);
  animation: drawLine 1s 0.5s ease forwards;
}
@keyframes drawLine { to { width: clamp(60px, 12vw, 160px); } }

/* Main title */
.title {
  font-family: 'Cormorant', 'Noto Serif SC', serif;
  font-size: clamp(2.2rem, 6vw, 5.5rem);
  font-weight: 400;
  line-height: 1.15;
  color: var(--text);
  letter-spacing: -0.01em;
}
.title .en {
  font-style: italic;
  color: var(--gold);
  font-size: 0.55em;
  display: block;
  font-weight: 400;
  letter-spacing: 0.02em;
  margin-top: 0.4em;
}

.title-wrap {
  overflow: hidden;
  opacity: 0;
  animation: fadeUp 1s 0.7s var(--ease) forwards;
}

/* Subtitle */
.subtitle {
  margin-top: clamp(2rem, 3.5vh, 3.5rem);
  font-size: clamp(0.75rem, 1.3vw, 1rem);
  color: var(--text-dim);
  font-weight: 300;
  letter-spacing: 0.06em;
  line-height: 2;
  opacity: 0;
  animation: fadeUp 0.8s 1.1s var(--ease) forwards;
}
.subtitle span {
  color: rgba(212,165,116,0.7);
  margin: 0 0.4em;
}

/* Bottom info */
.bottom {
  position: absolute;
  bottom: clamp(2rem, 4vh, 4rem);
  left: clamp(3rem, 8vw, 9rem);
  right: clamp(3rem, 8vw, 9rem);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  opacity: 0;
  animation: fadeUp 0.8s 1.4s var(--ease) forwards;
}
.bottom-name {
  font-family: 'Cormorant', serif;
  font-size: clamp(0.9rem, 1.6vw, 1.2rem);
  color: var(--text);
  font-weight: 600;
}
.bottom-role {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.55rem, 0.9vw, 0.7rem);
  color: var(--text-dim);
  letter-spacing: 0.12em;
  text-align: right;
  line-height: 1.8;
}

/* Breathing dot */
.pulse {
  position: absolute;
  bottom: clamp(2.5rem, 4.5vh, 4.5rem);
  right: clamp(3rem, 8vw, 9rem);
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  animation: pulse 3s ease-in-out infinite, fadeIn 0.5s 1.6s forwards;
  opacity: 0;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(212,165,116,0.4); }
  50% { box-shadow: 0 0 0 8px transparent; }
}

/* Style label badge */
.style-badge {
  position: fixed;
  top: 1.5rem; right: 1.5rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  color: var(--gold);
  border: 1px solid rgba(212,165,116,0.3);
  padding: 0.4em 0.8em;
  border-radius: 2px;
}

:root { --ease: cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="style-badge">STYLE A · CELESTIAL</div>

<div class="slide">
  <div class="label">千问 AI 产品经理 · 候选人自荐</div>
  <div class="line"></div>
  <div class="title-wrap">
    <h1 class="title">
      千问语音助手的产品思考
      <span class="en">Market · Experience · Ecosystem · Candidate</span>
    </h1>
  </div>
  <p class="subtitle">
    市场判断<span>·</span>体验报告<span>·</span>生态机会<span>·</span>候选人自荐
  </p>
  <div class="bottom">
    <div class="bottom-name">候选人姓名</div>
    <div class="bottom-role">
      应聘 千问 AI 产品经理<br>2026年5月
    </div>
  </div>
</div>

<div class="pulse"></div>
</body>
</html>
