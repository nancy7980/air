<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B — Precision</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Noto+Sans+SC:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #080A10;
  --gold: #C9A96E;
  --cyan: #5BCEAE;
  --text: #F0EDE8;
  --text-dim: rgba(240,237,232,0.4);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

body {
  background: var(--bg);
  height: 100vh;
  overflow: hidden;
  font-family: 'Noto Sans SC', sans-serif;
  position: relative;
}

/* Scan-line overlay */
.scanlines {
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events: none;
  z-index: 1;
}

/* Structural grid */
.grid {
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(201,169,110,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,169,110,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* Corner accent */
.corner-tl, .corner-br {
  position: fixed;
  width: 80px; height: 80px;
  z-index: 5;
}
.corner-tl {
  top: 2.5rem; left: 2.5rem;
  border-top: 1px solid rgba(201,169,110,0.5);
  border-left: 1px solid rgba(201,169,110,0.5);
  animation: fadeIn 0.5s 1.8s forwards;
  opacity: 0;
}
.corner-br {
  bottom: 2.5rem; right: 2.5rem;
  border-bottom: 1px solid rgba(201,169,110,0.5);
  border-right: 1px solid rgba(201,169,110,0.5);
  animation: fadeIn 0.5s 1.9s forwards;
  opacity: 0;
}

/* Right panel — vertical accent bar */
.accent-bar {
  position: fixed;
  right: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(
    to bottom,
    transparent,
    var(--gold) 30%,
    var(--cyan) 70%,
    transparent
  );
  animation: barSlide 1.2s 0.3s var(--ease) forwards;
  transform: scaleY(0);
  transform-origin: center;
}
@keyframes barSlide { to { transform: scaleY(1); } }

/* Chapter number — large background */
.bg-number {
  position: fixed;
  right: 5vw; top: 50%;
  transform: translateY(-50%);
  font-family: 'Syne', sans-serif;
  font-size: clamp(12rem, 22vw, 22rem);
  font-weight: 800;
  color: rgba(201,169,110,0.04);
  line-height: 1;
  pointer-events: none;
  user-select: none;
  letter-spacing: -0.05em;
}

/* Main layout */
.slide {
  position: relative;
  z-index: 10;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 clamp(3rem, 8vw, 9rem);
}

/* Chapter tag */
.chapter {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.6rem, 0.9vw, 0.72rem);
  color: var(--cyan);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: clamp(1.5rem, 3vh, 3rem);
  opacity: 0;
  animation: slideRight 0.7s 0.4s var(--ease) forwards;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.chapter::before {
  content: '';
  display: block;
  width: 30px;
  height: 1px;
  background: var(--cyan);
}

/* Title */
.title {
  font-family: 'Syne', 'Noto Sans SC', sans-serif;
  font-size: clamp(2rem, 5.5vw, 5rem);
  font-weight: 700;
  line-height: 1.1;
  color: var(--text);
  letter-spacing: -0.02em;
  opacity: 0;
  animation: slideRight 0.9s 0.7s var(--ease) forwards;
}
.title .highlight {
  color: var(--gold);
  position: relative;
}
.title .highlight::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0; right: 0;
  height: 2px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  animation: underline 0.6s 1.5s var(--ease) forwards;
}
@keyframes underline { to { transform: scaleX(1); } }

/* Divider */
.divider {
  margin: clamp(1.5rem, 3vh, 3rem) 0;
  height: 1px;
  background: linear-gradient(90deg, rgba(201,169,110,0.3), transparent);
  width: 0;
  animation: drawLine 0.8s 1.2s var(--ease) forwards;
}
@keyframes drawLine { to { width: min(400px, 50vw); } }

/* Subtitle tags */
.tags {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  opacity: 0;
  animation: slideRight 0.7s 1.4s var(--ease) forwards;
}
.tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.6rem, 0.9vw, 0.72rem);
  color: var(--text-dim);
  letter-spacing: 0.1em;
  border: 1px solid rgba(240,237,232,0.12);
  padding: 0.4em 0.9em;
}
.tag.active {
  color: var(--gold);
  border-color: rgba(201,169,110,0.3);
}

/* Bottom info */
.bottom {
  position: absolute;
  bottom: clamp(2rem, 4vh, 4rem);
  left: clamp(3rem, 8vw, 9rem);
  right: 5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  opacity: 0;
  animation: fadeIn 0.7s 1.7s forwards;
}
.bottom-name {
  font-family: 'Syne', sans-serif;
  font-size: clamp(0.85rem, 1.4vw, 1.05rem);
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.02em;
}
.bottom-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.55rem, 0.85vw, 0.68rem);
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-align: right;
  line-height: 2;
}

.style-badge {
  position: fixed;
  top: 1.5rem; right: 1.5rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  color: var(--cyan);
  border: 1px solid rgba(91,206,174,0.3);
  padding: 0.4em 0.8em;
  z-index: 20;
}

@keyframes fadeIn { to { opacity: 1; } }
@keyframes slideRight { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>
<div class="grid"></div>
<div class="scanlines"></div>
<div class="accent-bar"></div>
<div class="bg-number">01</div>
<div class="corner-tl"></div>
<div class="corner-br"></div>
<div class="style-badge">STYLE B · PRECISION</div>

<div class="slide">
  <div class="chapter">千问 AI 产品经理候选人</div>
  <h1 class="title">
    千问语音助手<br>
    <span class="highlight">产品思考</span>
  </h1>
  <div class="divider"></div>
  <div class="tags">
    <span class="tag active">市场判断</span>
    <span class="tag active">体验报告</span>
    <span class="tag active">生态机会</span>
    <span class="tag">候选人自荐</span>
  </div>
  <div class="bottom">
    <div class="bottom-name">候选人姓名</div>
    <div class="bottom-meta">
      应聘 千问 AI 产品经理<br>2026年5月
    </div>
  </div>
</div>
</body>
</html>
